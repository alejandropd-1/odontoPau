name: Editorial Publication

on:
  push:
    branches:
      - editorial/tina
    paths:
      - src/data/editorial/publication-request.json

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: editorial-publication
  cancel-in-progress: false

jobs:
  publish:
    name: protected-editorial-publication
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CI: "true"
      PRODUCTION_MARKER_URL: ${{ vars.EDITORIAL_PRODUCTION_MARKER_URL || 'https://paulagualtieri.com/deployment.json' }}

    steps:
      - name: Checkout editorial snapshot
        uses: actions/checkout@v4
        with:
          ref: editorial/tina
          fetch-depth: 0

      - name: Read publication request
        id: request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('src/data/editorial/publication-request.json', 'utf8'));
          const processRequest = request.status === 'pending' && request.requestId && request.requestId !== request.lastProcessedRequestId;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `process=${processRequest ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `request_id=${processRequest ? request.requestId : ''}\n`);
          NODE

      - name: Configure pnpm
        if: steps.request.outputs.process == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Configure Node.js
        if: steps.request.outputs.process == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.request.outputs.process == 'true'
        run: pnpm install --frozen-lockfile

      - name: Fetch publication refs
        if: steps.request.outputs.process == 'true'
        run: |
          git fetch --no-tags origin main editorial/tina
          test "$(git rev-parse origin/editorial/tina)" = "${GITHUB_SHA}"

      - name: Validate request and editorial scope
        if: steps.request.outputs.process == 'true'
        id: preflight
        run: pnpm exec tsx scripts/editorial-publication.ts preflight origin/main "${GITHUB_SHA}" origin/editorial/tina

      - name: Create or reuse technical pull request
        if: steps.request.outputs.process == 'true'
        id: pull_request
        shell: bash
        run: |
          pr_number="$(gh pr list --base main --head editorial/tina --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head editorial/tina \
              --title "[skip netlify] Publicación editorial ${{ steps.request.outputs.request_id }}" \
              --body "Pedido generado desde el panel editorial. Los controles internos validan el contenido antes de actualizar el sitio público.")"
            pr_number="${pr_url##*/}"
          fi
          gh pr edit "$pr_number" --title "[skip netlify] Publicación editorial ${{ steps.request.outputs.request_id }}"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Dispatch required quality gates
        if: steps.request.outputs.process == 'true'
        shell: bash
        run: |
          quality_check_count=0
          for attempt in {1..6}; do
            quality_check_count="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "quality-gates")] | length')"
            if [ "$quality_check_count" -gt 0 ]; then
              break
            fi
            sleep 5
          done
          if [ "$quality_check_count" -eq 0 ]; then
            gh workflow run quality-gates.yml --ref editorial/tina
          fi

      - name: Wait for required checks
        if: steps.request.outputs.process == 'true'
        id: quality
        shell: bash
        run: |
          for attempt in {1..24}; do
            check_count="$(gh pr checks "${{ steps.pull_request.outputs.number }}" --required --json name --jq '[.[] | select(.name == "quality-gates")] | length' 2>/dev/null || echo 0)"
            if [ "$check_count" -gt 0 ]; then
              break
            fi
            sleep 5
          done
          test "${check_count:-0}" -gt 0
          gh pr checks "${{ steps.pull_request.outputs.number }}" --required --watch --fail-fast --interval 10

      - name: Confirm immutable editorial snapshot
        if: steps.request.outputs.process == 'true'
        id: snapshot
        run: |
          git fetch --no-tags origin editorial/tina
          test "$(git rev-parse origin/editorial/tina)" = "${GITHUB_SHA}"

      - name: Merge protected publication
        if: steps.request.outputs.process == 'true'
        id: merge
        run: |
          gh pr merge "${{ steps.pull_request.outputs.number }}" --merge --delete-branch=false
          git fetch --no-tags origin main
          echo "commit=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Synchronize editorial branch and record deployment in progress
        if: steps.request.outputs.process == 'true'
        id: synchronize
        shell: bash
        run: |
          git push origin origin/main:refs/heads/editorial/tina
          git checkout -B editorial/tina origin/main
          pnpm exec tsx scripts/editorial-publication.ts mark-progress \
            deploying \
            "${{ steps.request.outputs.request_id }}" \
            "${{ steps.merge.outputs.commit }}" \
            - \
            "Los controles salieron bien. Estamos actualizando el sitio público."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/editorial/publication-request.json
          git commit -m "chore(editorial): registrar despliegue ${{ steps.request.outputs.request_id }} [skip netlify]"
          git push origin HEAD:editorial/tina

      - name: Confirm production serves the integrated commit
        if: steps.request.outputs.process == 'true'
        id: deploy
        run: |
          node scripts/wait-for-production-marker.mjs \
            "$PRODUCTION_MARKER_URL" \
            "${{ steps.merge.outputs.commit }}" \
            "${{ steps.request.outputs.request_id }}"

      - name: Record confirmed publication
        if: steps.request.outputs.process == 'true'
        shell: bash
        run: |
          pnpm exec tsx scripts/editorial-publication.ts mark-result \
            published \
            "${{ steps.request.outputs.request_id }}" \
            "${{ steps.merge.outputs.commit }}" \
            - \
            "Listo: los cambios ya están publicados en el sitio."
          git add -- src/data/editorial/publication-request.json
          git commit -m "chore(editorial): confirmar publicación ${{ steps.request.outputs.request_id }} [skip netlify]"
          git push origin HEAD:editorial/tina

      - name: Record safe failure
        if: failure() && steps.request.outputs.process == 'true'
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          git fetch --no-tags origin main editorial/tina
          git checkout -B editorial/tina origin/editorial/tina
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            command="mark-progress"
            result="waiting_index"
            production_commit="$(git rev-parse origin/main)"
            issue_kind="deploy_not_confirmed"
            summary="Los cambios fueron aprobados, pero todavía no pudimos confirmar el sitio público. No publiques otra tanda y pedí ayuda."
          else
            command="mark-result"
            result="failed"
            production_commit="-"
            issue_kind="technical"
            summary="Tuvimos un problema técnico. El sitio público sigue igual y tus cambios continúan guardados en la vista previa."

            if [ "$PREFLIGHT_OUTCOME" = "failure" ]; then
              issue_kind="content"
              summary="Encontramos algo que necesita una corrección. Revisá el contenido en la vista previa y volvé a intentarlo."
            elif [ "$QUALITY_OUTCOME" = "failure" ]; then
              issue_kind="checks_failed"
              summary="Uno de los controles no pasó. El sitio público sigue igual; pedí ayuda para revisar tus cambios."
            elif [ "$SNAPSHOT_OUTCOME" = "failure" ]; then
              issue_kind="snapshot_changed"
              summary="Guardaste nuevos cambios mientras se publicaba. Revisá la vista previa completa y volvé a publicar."
            elif [ "$MERGE_OUTCOME" = "failure" ]; then
              issue_kind="merge_failed"
              summary="No pudimos completar la publicación por un problema técnico. El sitio público sigue igual; pedí ayuda."
            fi
          fi
          pnpm exec tsx scripts/editorial-publication.ts "$command" \
            "$result" \
            "${{ steps.request.outputs.request_id }}" \
            "$production_commit" \
            "$issue_kind" \
            "$summary" || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/editorial/publication-request.json
          git commit -m "chore(editorial): registrar incidencia ${{ steps.request.outputs.request_id }} [skip netlify]" || exit 0
          git push origin HEAD:editorial/tina
