name: Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CONTEXT: deploy-preview
      NETLIFY_PREVIEW_SERVER: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenSpec
        run: pnpm run validate:openspec

      - name: Validate CMS contracts
        run: pnpm run validate:cms-contracts

      - name: Validate Tina branch safety
        run: pnpm run validate:tina-branch

      - name: Validate Tina adapter and editorial rules
        run: |
          pnpm run test:tina-adapter
          pnpm run test:tina-editorial-rules
          pnpm run test:tina-media
          pnpm run test:tina-publication
          pnpm run test:tina-publication-workflow
          pnpm run test:netlify-ignore-build
          pnpm run test:tina-runtime
          pnpm run test:tina-visual

      - name: Audit Tina content and lock
        run: |
          pnpm run validate:tina-content
          pnpm run validate:tina-lock

      - name: Build Tina admin without cloud credentials
        run: pnpm run build:cms:local

      - name: Validate pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: TypeScript
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build preview
        run: pnpm run build
