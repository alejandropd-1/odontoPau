            - heading "¿Qué se trató en este caso?" [level=2] [ref=f1e67]
            - generic [ref=f1e68]:
              - paragraph [ref=f1e69]: El caso correspondió a una necrosis pulpar y fue tratado mediante una técnica endodóntica mecanizada, según la información clínica provista por Paula.
              - paragraph [ref=f1e70]: La endodoncia trabaja sobre el sistema de conductos del diente. La indicación y el plan se definen después de una evaluación clínica y radiográfica individual.
          - generic [ref=f1e71]:
            - heading "¿Qué significa que la técnica sea mecanizada?" [level=2] [ref=f1e72]
            - generic [ref=f1e73]:
              - paragraph [ref=f1e74]: En una endodoncia mecanizada, parte de la preparación de los conductos se realiza con instrumental accionado por un motor específico. El profesional selecciona el sistema y la secuencia según la anatomía y las necesidades del caso.
              - paragraph [ref=f1e75]: "La técnica utilizada es solo una parte del tratamiento: el diagnóstico, la planificación, el control y la restauración posterior también dependen de cada situación clínica."
