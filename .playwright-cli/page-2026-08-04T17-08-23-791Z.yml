        - generic [ref=f1e61]:
          - generic [ref=f1e62]:
            - complementary [ref=f1e63]:
              - generic [ref=f1e66]:
                - heading "Una guía general" [level=2] [ref=f1e67]
                - paragraph [ref=f1e68]: Si recibiste una indicación diferente durante la consulta, seguí la pauta personalizada del profesional tratante.
            - region [ref=f1e69]:
              - heading "Cuidados después de la extracción" [level=2] [ref=f1e70]
              - list [ref=f1e71]:
                - listitem [ref=f1e72]: Mantener una gasa estéril durante 45 minutos a 1 hora y retirarla.
                - listitem [ref=f1e73]: Es aconsejable no fumar, no mascar chicles, no escupir con fuerza, no tomar mate ni nada con bombilla durante las primeras 24 horas.
                - listitem [ref=f1e74]: No realizar actividades físicas ni trabajos forzados (no agacharse o levantar peso) durante 1 o 2 días después de la extracción.
                - listitem [ref=f1e75]: Dieta blanda, beber líquido abundantemente (no caliente). Almorzar o cenar utilizando las piezas dentales del lado contrario de la extracción durante 2 días.
                - listitem [ref=f1e76]: En caso de hemorragia (salida profusa de sangre), consultar con el odontólogo. No confundir con salivar con tinte rosado, es normal.
                - listitem [ref=f1e77]: Si se le han aplicado puntos de sutura, el hilo es no reabsorbible, por lo que deberá concurrir a la semana para el retiro y control postoperatorio.
                - listitem [ref=f1e78]: En caso de edema (notar la cara hinchada) pero sin dolor, colocar compresas frías, 10 minutos cada 1 o 2 horas durante el día.
                - listitem [ref=f1e79]: En caso de dolor, infección o retardo del cierre de la herida, consultar con el odontólogo enseguida.
                - listitem [ref=f1e80]: Los hematomas ocasionales en la piel o mucosa no revisten gravedad y se eliminan solos en pocos días.
                - listitem [ref=f1e81]: La boca debe higienizarse de acuerdo a las indicaciones del profesional.
                - listitem [ref=f1e82]: Evitar enjuagues bucales, salvo indicación del odontólogo.
            - complementary [ref=f1e83]:
              - generic [ref=f1e86]:
                - heading "Cuándo consultar" [level=2] [ref=f1e87]
                - paragraph [ref=f1e88]: En caso de hemorragia, dolor, infección o retardo del cierre de la herida, consultá con el odontólogo según las indicaciones de esta guía.
