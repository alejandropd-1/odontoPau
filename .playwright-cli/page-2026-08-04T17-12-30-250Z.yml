        - generic [ref=f2e53]:
          - generic [ref=f2e54]:
            - complementary [ref=f2e55]:
              - generic [ref=f2e58]:
                - heading "Una guía general" [level=2] [ref=f2e59]
                - paragraph [ref=f2e60]: Si recibiste una indicación diferente durante la consulta, seguí la pauta personalizada del profesional tratante.
            - region [ref=f2e61]:
              - heading "Cuidados después de la extracción" [level=2] [ref=f2e62]
              - list [ref=f2e63]:
                - listitem [ref=f2e64]: Mantener una gasa estéril durante 45 minutos a 1 hora y retirarla.
                - listitem [ref=f2e65]: Es aconsejable no fumar, no mascar chicles, no escupir con fuerza, no tomar mate ni nada con bombilla durante las primeras 24 horas.
                - listitem [ref=f2e66]: No realizar actividades físicas ni trabajos forzados (no agacharse o levantar peso) durante 1 o 2 días después de la extracción.
                - listitem [ref=f2e67]: Dieta blanda, beber líquido abundantemente (no caliente). Almorzar o cenar utilizando las piezas dentales del lado contrario de la extracción durante 2 días.
                - listitem [ref=f2e68]: En caso de hemorragia (salida profusa de sangre), consultar con el odontólogo. No confundir con salivar con tinte rosado, es normal.
                - listitem [ref=f2e69]: Si se le han aplicado puntos de sutura, el hilo es no reabsorbible, por lo que deberá concurrir a la semana para el retiro y control postoperatorio.
                - listitem [ref=f2e70]: En caso de edema (notar la cara hinchada) pero sin dolor, colocar compresas frías, 10 minutos cada 1 o 2 horas durante el día.
                - listitem [ref=f2e71]: En caso de dolor, infección o retardo del cierre de la herida, consultar con el odontólogo enseguida.
                - listitem [ref=f2e72]: Los hematomas ocasionales en la piel o mucosa no revisten gravedad y se eliminan solos en pocos días.
                - listitem [ref=f2e73]: La boca debe higienizarse de acuerdo a las indicaciones del profesional.
                - listitem [ref=f2e74]: Evitar enjuagues bucales, salvo indicación del odontólogo.
            - complementary [ref=f2e75]:
              - generic [ref=f2e78]:
                - heading "Cuándo consultar" [level=2] [ref=f2e79]
                - paragraph [ref=f2e80]: En caso de hemorragia, dolor, infección o retardo del cierre de la herida, consultá con el odontólogo según las indicaciones de esta guía.
