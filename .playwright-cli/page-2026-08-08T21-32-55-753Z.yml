        - generic [ref=e57]:
          - region [ref=e58]:
            - heading "Pautas principales de uso" [level=2] [ref=e59]
            - list [ref=e60]:
              - listitem [ref=e61]: Utilizá tus alineadores KeepSmiling un mínimo de 22 horas al día para asegurar el movimiento continuo planificado.
              - listitem [ref=e62]: Retiralos únicamente para comer, beber líquidos calientes o azucarados, y para realizar tu higiene bucal.
              - listitem [ref=e63]: Al colocar cada placa, presioná suavemente en el frente y luego sobre los molares hasta sentir que calza con precisión.
              - listitem [ref=e64]: Para retirarlos, desenganchá suavemente con la yema del dedo desde la parte interna de las muelas traseras hacia adelante.
              - listitem [ref=e65]: Guardá siempre tus alineadores dentro de su estuche rígido protector cuando no los estés usando.
              - listitem [ref=e66]: Higienizalos todos los días con agua fría o templada y un cepillo de cerdas suaves. Evitá el agua caliente porque puede deformar el material.
              - listitem [ref=e67]: Cepillate los dientes y pasá hilo dental antes de volver a colocártelos tras cada comida.
              - listitem [ref=e68]: Ante cualquier desprendimiento de atache o molestia persistente al cambiar de placa, escribinos para asesorarte.
          - region [ref=e69]:
            - heading "Cuidado y conservación de las placas" [level=2] [ref=e70]
