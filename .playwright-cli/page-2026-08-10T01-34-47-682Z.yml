            - heading "Pautas principales de uso" [level=2] [ref=f146e57]
            - list [ref=f146e58]:
              - listitem [ref=f146e59]: Utilizá tus alineadores KeepSmiling un mínimo de 22 horas al día para asegurar el movimiento continuo planificado.
              - listitem [ref=f146e60]: Retiralos únicamente para comer, beber líquidos calientes o azucarados, y para realizar tu higiene bucal.
              - listitem [ref=f146e61]: Al colocar cada placa, presioná suavemente en el frente y luego sobre los molares hasta sentir que calza con precisión.
              - listitem [ref=f146e62]: Para retirarlos, desenganchá suavemente con la yema del dedo desde la parte interna de las muelas traseras hacia adelante.
              - listitem [ref=f146e63]: Guardá siempre tus alineadores dentro de su estuche rígido protector cuando no los estés usando.
              - listitem [ref=f146e64]: Higienizalos todos los días con agua fría o templada y un cepillo de cerdas suaves. Evitá el agua caliente porque puede deformar el material.
              - listitem [ref=f146e65]: Cepillate los dientes y pasá hilo dental antes de volver a colocártelos tras cada comida.
              - listitem [ref=f146e66]: Ante cualquier desprendimiento de atache o molestia persistente al cambiar de placa, escribinos para asesorarte.
