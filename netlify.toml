[build]
  command = "pnpm run build"
  publish = ".next"
  ignore = "node ./scripts/netlify-ignore-build.mjs"

[build.environment]
  NODE_VERSION = "22"

# El admin de produccion apunta siempre a la rama editorial permanente
# configurada mediante NEXT_PUBLIC_TINA_BRANCH; la guarda de seguridad de Tina
# rechaza main/master. El sitio publico continua publicandose solamente desde
# main mediante el flujo Git de Netlify.
[context.production]
  command = "pnpm run build:cms && pnpm run build"

[context.deploy-preview]
  command = "pnpm run build:cms && pnpm run build"

[context.branch-deploy]
  command = "pnpm run build:cms && pnpm run build"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/deployment.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
