schema: spec-driven

context: |
  Sitio profesional de la Dra. Paula Gualtieri, orientado a pacientes de odontología.
  Stack: Next.js App Router, React, TypeScript, SASS, JSON versionado y TinaCMS/TinaCloud.
  El contenido canónico está en src/data, los recursos públicos en public/images,
  el CMS en tina y src/cms, y el diseño en src/styles.
  Tina edita sobre una rama no productiva; main publica mediante Netlify.
  El circuito editorial distingue contenido preparado, aprobado y publicado.
  Los requisitos de contenido clínico, privacidad, CMS y publicación están en openspec/specs.
  El sitio es independiente de la webapp OdontoPro.
